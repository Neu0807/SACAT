{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SACAT{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS en el <head> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Y SweetAlert2 JS antes de cerrar el <body> -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --brand-primary: #1E3A8A;
            --brand-dark: #172554;
            --accent-color: #0D9488;
            --brand-light: #EEF2FF;
            --color-success: #0E9F6E;
            --color-error: #C81E1E;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 75px;
            --navbar-height: 65px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-bs-theme="dark"] {
            --bg-body: #020617;
            --bg-card: #0F172A;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: #1E293B;
            --brand-light: #1E293B;
            --color-success: #34D399;
            --color-error: #F87171;
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; overflow: hidden; }
        
        .sacat-wrapper { display: flex; width: 100vw; height: 100vh; }
        
        .sacat-main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-body);
        }

        .sacat-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="sacat-wrapper" id="masterWrapper">
        {% include 'includes/_sidebar.html' %}

        <div class="sacat-main-panel">
            {% include 'includes/_navbar.html' %}

            <main class="sacat-content-area">
                <div class="container-fluid">
                    {% block content %}{% endblock %}
                </div>
                {% include 'includes/_footer.html' %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wrapper = document.getElementById('masterWrapper');
            const toggleBtn = document.getElementById('toggleSidebar');
            const htmlEl = document.documentElement;

            // Sidebar Toggle
            if(toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    wrapper.classList.toggle('collapsed');
                    localStorage.setItem('sidebar_state', wrapper.classList.contains('collapsed'));
                });
            }

            if (localStorage.getItem('sidebar_state') === 'true') {
                wrapper.classList.add('collapsed');
            }

            // Tema Claro/Oscuro
            const btnTheme = document.getElementById('btnTheme');
            const savedTheme = localStorage.getItem('sacat_theme') || 'light';
            htmlEl.setAttribute('data-bs-theme', savedTheme);

            if(btnTheme) {
                btnTheme.addEventListener('click', () => {
                    const newTheme = htmlEl.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
                    htmlEl.setAttribute('data-bs-theme', newTheme);
                    localStorage.setItem('sacat_theme', newTheme);
                    btnTheme.innerHTML = newTheme === 'dark' ? '<i class="fas fa-sun text-warning fs-5"></i>' : '<i class="fas fa-moon text-muted fs-5"></i>';
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
