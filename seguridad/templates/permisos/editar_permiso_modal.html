<div class="p-4">
    <form id="formEditarPermiso">
        {% csrf_token %}
        <div class="mb-4 text-center">
            <span class="badge px-3 py-2 border" style="background-color: var(--brand-light); color: var(--brand-primary); border-color: var(--brand-primary) !important;">
                <i class="fas fa-key me-2"></i>Editando: {{ permiso.nombre_permiso }}
            </span>
        </div>

        {# Nombre del permiso (bloqueado) #}
        <div class="mb-3">
            <label class="form-label fw-bold text-muted small text-uppercase">Nombre del Permiso (Protegido)</label>
            <input type="text" class="form-control bg-light fw-bold" value="{{ permiso.nombre_permiso }}" readonly disabled>
        </div>

        {# Descripción #}
        <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase" style="color: var(--brand-primary);">Descripción</label>
            <textarea id="desc_edit" class="form-control shadow-sm" rows="4">{{ permiso.descripcion }}</textarea>
        </div>

        {# Estado (activo/inactivo) #}
        <div class="form-check form-switch mb-4 p-3 border rounded-3" style="background-color: var(--bg-body);">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <label class="form-check-label fw-bold d-block" for="editActivo">Permiso Activo</label>
                    <small class="text-muted">Si se desactiva, este permiso no podrá ser asignado a roles.</small>
                </div>
                <input class="form-check-input" type="checkbox" id="editActivo" {% if permiso.esta_activo %}checked{% endif %} style="width: 3em; height: 1.5em;">
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary fw-bold py-2 shadow" style="background-color: var(--brand-primary); border: none;">
                <i class="fas fa-save me-2"></i>Guardar Cambios
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('formEditarPermiso').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
        const swalBg = isDark ? '#1E293B' : '#ffffff';
        const swalColor = isDark ? '#F8FAFC' : '#0F172A';

        Swal.fire({ 
            title: 'Actualizando...', 
            allowOutsideClick: false, 
            background: swalBg,
            color: swalColor,
            didOpen: () => { Swal.showLoading(); } 
        });

        fetch("{% url 'editar_permiso' permiso.id %}", {
            method: 'POST',
            headers: { 
                'X-CSRFToken': '{{ csrf_token }}', 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ 
                descripcion: document.getElementById('desc_edit').value,
                esta_activo: document.getElementById('editActivo').checked
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Actualizado!',
                    text: res.mensaje,
                    confirmButtonColor: 'var(--brand-primary)',
                    background: swalBg,
                    color: swalColor
                }).then(() => location.reload());
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: res.mensaje, background: swalBg, color: swalColor });
            }
        })
        .catch(err => Swal.fire('Error', 'No se pudo conectar con el servidor', 'error'));
    });
</script>
