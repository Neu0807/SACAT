<div class="p-4">
    <form id="formEditarRol">
        {% csrf_token %}
        <div class="mb-4 text-center">
            <span class="badge px-3 py-2 border" style="background-color: var(--brand-light); color: var(--brand-primary); border-color: var(--brand-primary) !important;">
                <i class="fas fa-fingerprint me-2"></i>Editando: {{ rol.nombre_rol }}
            </span>
        </div>

        {# Nombre del Rol (bloqueado por seguridad) #}
        <div class="mb-3">
            <label class="form-label fw-bold text-muted small text-uppercase">Nombre del Rol (Protegido)</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock"></i></span>
                <input type="text" class="form-control border-start-0 bg-light fw-bold" value="{{ rol.nombre_rol }}" readonly disabled>
            </div>
        </div>

        {# Único campo editable #}
        <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase" style="color: var(--brand-primary);">Descripción del Rol</label>
            <textarea id="desc_edit" class="form-control shadow-sm" rows="5" required>{{ rol.descripcion }}</textarea>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary fw-bold py-2 shadow" style="background-color: var(--brand-primary); border: none;">
                <i class="fas fa-sync-alt me-2"></i>Guardar Cambios
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('formEditarRol').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
        const swalBg = isDark ? '#1E293B' : '#ffffff';
        const swalColor = isDark ? '#F8FAFC' : '#0F172A';

        Swal.fire({ 
            title: 'Actualizando...', 
            allowOutsideClick: false, 
            background: swalBg,
            color: swalColor,
            didOpen: () => { Swal.showLoading(); } 
        });

        fetch("{% url 'editar_rol' rol.id %}", {
            method: 'POST',
            headers: { 
                'X-CSRFToken': '{{ csrf_token }}', 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ 
                nombre_rol: "{{ rol.nombre_rol|escapejs }}",
                descripcion: document.getElementById('desc_edit').value 
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Actualizado!',
                    text: res.mensaje,
                    confirmButtonColor: 'var(--brand-primary)',
                    background: swalBg,
                    color: swalColor
                }).then(() => location.reload());
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: res.mensaje, background: swalBg, color: swalColor });
            }
        })
        .catch(err => Swal.fire('Error', 'No se pudo conectar con el servidor', 'error'));
    });
</script>
