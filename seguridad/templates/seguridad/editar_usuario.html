<div class="p-4">
    <div class="mb-4 text-center">
        <span class="badge px-3 py-2 border" style="background-color: var(--brand-light); color: var(--brand-primary); border-color: var(--brand-primary) !important;">
            <i class="fas fa-user-gear me-2"></i>Editando Cédula: {{ user_editar.nombre_usuario }}
        </span>
    </div>

    <form id="formEditarUsuario">
        {% csrf_token %}
        <div class="mb-4 text-muted small text-center italic">
            El nivel de acceso Superusuario no puede ser modificado por seguridad.
        </div>

        <div class="form-check form-switch mb-4 p-3 border rounded-3 bg-light-subtle">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <label class="form-check-label fw-bold d-block">Acceso Staff</label>
                    <small class="text-muted">Controla el acceso al sitio administrativo.</small>
                </div>
                <input class="form-check-input" type="checkbox" id="editIsStaff" 
                       {% if user_editar.is_staff %}checked{% endif %} style="width: 3em; height: 1.5em;">
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary fw-bold py-2 shadow" style="background-color: var(--brand-primary); border: none;">
                Actualizar Datos
            </button>
        </div>
    </form>
</div>

<script>
document.getElementById('formEditarUsuario').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Capturamos el estado del checkbox
    const data = { 
        is_staff: document.getElementById('editIsStaff').checked 
    };

    Swal.fire({ 
        title: 'Actualizando...', 
        text: 'Por favor espere',
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
    });

    // CORRECCIÓN CLAVE: Usamos la URL exacta de edición de este usuario
    // Django reemplazará {{ user_editar.nombre_usuario }} por la cédula real
    fetch("/usuarios/editar/{{ user_editar.nombre_usuario }}/", {
        method: 'POST',
        headers: { 
            'X-CSRFToken': '{{ csrf_token }}', 
            'Content-Type': 'application/json' 
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        if (result.success) {
            Swal.fire({
                icon: 'success',
                title: '¡Actualizado!',
                text: result.mensaje,
                confirmButtonColor: 'var(--brand-primary)'
            }).then(() => {
                location.reload(); // Recarga la tabla para ver los cambios
            });
        } else {
            Swal.fire('Error', result.mensaje, 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
    });
});
</script>
