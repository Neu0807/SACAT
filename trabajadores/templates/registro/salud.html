{% extends 'base.html' %}

{% block content %}
<style>
    /* =======================================================================
       1. SISTEMA DE DISEÑO SACAT
       ======================================================================= */
    :root {
        --bg-body: #F8FAFC; --bg-card: #ffffff; --text-main: #0F172A; 
        --text-muted: #64748B; --border-color: #E2E8F0; 
        --brand-primary: #1E3A8A; --brand-dark: #172554; --brand-light: #EEF2FF; 
        --color-error: #C81E1E; --color-success: #0E9F6E;
    }

    [data-bs-theme="dark"] {
        --bg-body: #0F172A; --bg-card: #1E293B; --text-main: #F8FAFC; 
        --text-muted: #E2E8F0; --border-color: #64748B; 
        --brand-primary: #0D9488; --brand-dark: #0F766E; --brand-light: #1E293B; 
    }

    /* =======================================================================
       2. WIDGET DE PASOS (STEPPER RECTANGULAR ORIGINAL)
       ======================================================================= */
    .stepper-box { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 15px 35px 15px; transition: all 0.3s ease; }
    .sacat-stepper { display: flex; justify-content: space-between; align-items: center; position: relative; }
    .sacat-stepper::before { content: ''; position: absolute; top: 28px; left: 5%; right: 5%; height: 2px; background-color: var(--border-color); z-index: 1; }
    .sacat-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
    
    .step-circle { width: 18px; height: 18px; border-radius: 50%; background-color: var(--border-color); border: 2px solid var(--bg-card); transition: all 0.3s ease; }
    .step-text { position: absolute; top: 40px; font-size: 0.65rem; font-weight: 800; color: var(--brand-primary); text-transform: uppercase; }
    .step-title { font-weight: 800; color: var(--text-muted); margin-bottom: 4px; font-size: 0.8rem; }

    .sacat-step.completed .step-circle { background-color: var(--brand-primary); border-color: var(--brand-primary); color: white; display: flex; align-items: center; justify-content: center; }
    .sacat-step.completed .step-circle::after { content: '✓'; font-size: 0.6rem; font-weight: bold; }
    
    .sacat-step.current .step-title { font-size: 0.65rem; text-transform: uppercase; color: var(--brand-primary); }
    .sacat-step.current .step-circle { background-color: var(--bg-card); border: 3px solid var(--brand-primary); transform: scale(1.6); box-shadow: 0 4px 8px rgba(0,0,0, 0.1); }

    /* =======================================================================
       3. INPUTS, BOTONES Y BANDEJAS
       ======================================================================= */
    .custom-input { background-color: var(--bg-body) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; border-radius: 6px !important; padding: 6px 10px !important; font-size: 0.8rem !important; transition: all 0.3s ease; }
    .custom-input:focus { border-color: var(--brand-primary) !important; box-shadow: 0 0 0 0.25rem rgba(30, 58, 138, 0.15) !important; }
    
    .btn-primary { background-color: var(--brand-primary) !important; border-color: var(--brand-primary) !important; color: #ffffff !important; font-weight: 600 !important; border-radius: 8px !important; padding: 10px 25px !important; font-size: 0.85rem !important; }
    .btn-primary:hover { background-color: var(--brand-dark) !important; transform: translateY(-2px); }
    
    .btn-circle-add { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--brand-primary); color: var(--brand-primary); background: transparent; transition: all 0.2s; }
    .btn-circle-add:hover { background: var(--brand-light); transform: scale(1.05); }

    .lista-salud { max-height: 150px; overflow-y: auto; overflow-x: hidden; padding-right: 5px; margin-top: 5px; }
    .seccion-condicional { display: none; animation: slideDown 0.3s ease-out; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .bg-primary-soft { background-color: var(--brand-light); }
    .text-uppercase { text-transform: uppercase; }
</style>

<div class="container-fluid py-2">
    
    <div class="row justify-content-center mb-2">
        <div class="col-12 col-lg-10">
            <div class="stepper-box shadow-sm">
                <div class="sacat-stepper">
                    <div class="sacat-step completed"><div class="step-title">1</div><div class="step-circle"></div></div>
                    <div class="sacat-step completed"><div class="step-title">2</div><div class="step-circle"></div></div>
                    <div class="sacat-step completed"><div class="step-title">3</div><div class="step-circle"></div></div>
                    <div class="sacat-step completed"><div class="step-title">4</div><div class="step-circle"></div></div>
                    <div class="sacat-step completed"><div class="step-title">5</div><div class="step-circle"></div></div>
                    <div class="sacat-step current">
                        <div class="step-title">Paso 6</div>
                        <div class="step-circle"></div>
                    </div>
                    {% for i in "789" %}
                    <div class="sacat-step future"><div class="step-title">{{ i }}</div><div class="step-circle"></div></div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <form id="formPaso6">
                {% csrf_token %}
                
                <div class="card border-0 shadow-sm mb-3" style="background-color: var(--bg-card); border-radius: 12px;">
                    <div class="card-header bg-transparent border-0 pt-3 px-3 pb-0">
                        <div class="d-flex align-items-center">
                            <div class="p-1 px-2 bg-primary-soft rounded-2 me-2"><i class="fas fa-heartbeat" style="color: var(--brand-primary);"></i></div>
                            <h6 class="fw-bold mb-0 text-main" style="font-size: 0.85rem;">GENERAL Y ALERGIAS</h6>
                        </div>
                        <hr class="mt-2 mb-0 opacity-10">
                    </div>
                    <div class="card-body p-3">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold" style="font-size: 0.65rem;">TIPO DE SANGRE <span class="text-danger">*</span></label>
                                <select name="tipo_sangre" class="form-select custom-input" required>
                                    <option value="" selected disabled>Seleccione...</option>
                                    <option value="O+">O+</option><option value="O-">O-</option>
                                    <option value="A+">A+</option><option value="A-">A-</option>
                                    <option value="B+">B+</option><option value="B-">B-</option>
                                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                </select>
                            </div>
                            <div class="col-md-3 text-center border-start border-end">
                                <label class="form-label fw-bold" style="font-size: 0.65rem;">¿POSEE ALERGIAS?</label>
                                <div class="form-check form-switch d-flex justify-content-center pt-1">
                                    <input class="form-check-input" type="checkbox" id="sw_alergias">
                                    <label class="form-check-label fw-bold ms-2" for="sw_alergias" id="lbl_alergias" style="font-size: 0.75rem; color: var(--brand-primary);">NO</label>
                                </div>
                            </div>
                            <div class="col-md-5 seccion-condicional" id="box_alergias">
                                <label class="form-label fw-bold" style="font-size: 0.65rem;">DESCRIBA LAS ALERGIAS <span class="text-danger">*</span></label>
                                <input type="text" name="alergias" id="input_alergias" class="form-control custom-input text-uppercase" placeholder="EJ: PENICILINA, POLEN...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-3" style="background-color: var(--bg-card); border-radius: 12px;">
                    <div class="card-header bg-transparent border-0 pt-3 px-3 pb-0">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <div class="p-1 px-2 bg-primary-soft rounded-2 me-2"><i class="fas fa-wheelchair" style="color: var(--brand-primary);"></i></div>
                                <h6 class="fw-bold mb-0 text-main" style="font-size: 0.85rem;">DISCAPACIDADES</h6>
                            </div>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" id="sw_discapacidad">
                                <label class="form-check-label fw-bold ms-2" for="sw_discapacidad" id="lbl_discapacidad" style="font-size: 0.75rem; color: var(--brand-primary);">NO</label>
                            </div>
                        </div>
                        <hr class="mt-2 mb-0 opacity-10">
                    </div>
                    <div class="card-body p-3 seccion-condicional" id="box_discapacidad">
                        <div class="p-2 rounded mb-2" style="background-color: var(--bg-body); border: 1px solid var(--border-color);">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-5">
                                    <label class="form-label fw-bold" style="font-size: 0.6rem;">TIPO DISCAPACIDAD <span class="text-danger">*</span></label>
                                    <select id="temp_discapacidad" class="form-select custom-input">
                                        <option value="" selected disabled>Seleccione...</option>
                                        {% for d in discapacidades %}<option value="{{ d.id }}">{{ d.descripcion }}</option>{% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-size: 0.6rem;">NRO. CARNET CONAPDIS</label>
                                    <input type="text" id="temp_conapdis" class="form-control custom-input" placeholder="INGRESE NÚMERO">
                                </div>
                                <div class="col-md-1 d-flex justify-content-center pb-1">
                                    <button type="button" class="btn-circle-add" id="btnAddDiscapacidad"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                        <div id="listaDiscapacidades" class="lista-salud"></div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-4" style="background-color: var(--bg-card); border-radius: 12px;">
                    <div class="card-header bg-transparent border-0 pt-3 px-3 pb-0">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <div class="p-1 px-2 bg-primary-soft rounded-2 me-2"><i class="fas fa-notes-medical" style="color: var(--brand-primary);"></i></div>
                                <h6 class="fw-bold mb-0 text-main" style="font-size: 0.85rem;">PATOLOGÍAS CRÓNICAS</h6>
                            </div>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" id="sw_patologias">
                                <label class="form-check-label fw-bold ms-2" for="sw_patologias" id="lbl_patologias" style="font-size: 0.75rem; color: var(--brand-primary);">NO</label>
                            </div>
                        </div>
                        <hr class="mt-2 mb-0 opacity-10">
                    </div>
                    <div class="card-body p-3 seccion-condicional" id="box_patologias">
                        <div class="p-2 rounded mb-2" style="background-color: var(--bg-body); border: 1px solid var(--border-color);">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-5">
                                    <label class="form-label fw-bold" style="font-size: 0.6rem;">PATOLOGÍA <span class="text-danger">*</span></label>
                                    <select id="temp_patologia" class="form-select custom-input">
                                        <option value="" selected disabled>Seleccione...</option>
                                        {% for p in patologias %}<option value="{{ p.id }}">{{ p.descripcion }}</option>{% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-size: 0.6rem;">DETALLE / OBSERVACIÓN</label>
                                    <input type="text" id="temp_detalle_pat" class="form-control custom-input text-uppercase" placeholder="EJ: TRATAMIENTO DIARIO">
                                </div>
                                <div class="col-md-1 d-flex justify-content-center pb-1">
                                    <button type="button" class="btn-circle-add" id="btnAddPatologia"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                        <div id="listaPatologias" class="lista-salud"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-3">
                    <a href="{% url 'registro_paso5' %}" class="btn px-4 fw-bold" style="background-color: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color);">
                        <i class="fas fa-chevron-left me-2"></i>VOLVER
                    </a>
                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm" id="btnGuardar">
                        GUARDAR Y CONTINUAR <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    const swalBg = isDark ? '#1E293B' : '#ffffff';
    const swalColor = isDark ? '#F8FAFC' : '#0F172A';

    // Función para Switches y validación dinámica
    const setupSwitch = (swId, boxId, lblId, inputId = null) => {
        const sw = document.getElementById(swId);
        const box = document.getElementById(boxId);
        const lbl = document.getElementById(lblId);
        const input = inputId ? document.getElementById(inputId) : null;

        sw.addEventListener('change', function() {
            if (this.checked) {
                box.style.display = 'block';
                lbl.innerText = 'SÍ';
                if(input) input.required = true;
            } else {
                box.style.display = 'none';
                lbl.innerText = 'NO';
                if(input) {
                    input.required = false;
                    input.value = '';
                }
            }
        });
    };

    setupSwitch('sw_alergias', 'box_alergias', 'lbl_alergias', 'input_alergias');
    setupSwitch('sw_discapacidad', 'box_discapacidad', 'lbl_discapacidad');
    setupSwitch('sw_patologias', 'box_patologias', 'lbl_patologias');

    document.querySelectorAll('.text-uppercase').forEach(input => {
        input.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
    });

    // --- BANDEJA DISCAPACIDAD ---
    const btnAddD = document.getElementById('btnAddDiscapacidad');
    const listaD = document.getElementById('listaDiscapacidades');
    btnAddD.addEventListener('click', function() {
        const sel = document.getElementById('temp_discapacidad');
        const nro = document.getElementById('temp_conapdis');
        if(!sel.value) { sel.classList.add('is-invalid'); return; }
        
        const row = document.createElement('div');
        row.className = "d-flex justify-content-between align-items-center p-2 mb-2 rounded border shadow-sm item-temp";
        row.style.backgroundColor = "var(--bg-body)";
        row.innerHTML = `
            <input type="hidden" name="discapacidad_id[]" value="${sel.value}">
            <input type="hidden" name="nro_conapdis[]" value="${nro.value}">
            <div style="font-size: 0.75rem;"><i class="fas fa-check-circle text-primary me-2"></i><b>${sel.options[sel.selectedIndex].text}</b> ${nro.value ? ' - '+nro.value : ''}</div>
            <button type="button" class="btn btn-sm text-danger" onclick="this.closest('.item-temp').remove()"><i class="fas fa-times-circle fa-lg"></i></button>`;
        listaD.appendChild(row);
        sel.value = ''; nro.value = ''; sel.classList.remove('is-invalid');
    });

    // --- BANDEJA PATOLOGÍA ---
    const btnAddP = document.getElementById('btnAddPatologia');
    const listaP = document.getElementById('listaPatologias');
    btnAddP.addEventListener('click', function() {
        const sel = document.getElementById('temp_patologia');
        const det = document.getElementById('temp_detalle_pat');
        if(!sel.value) { sel.classList.add('is-invalid'); return; }

        const row = document.createElement('div');
        row.className = "d-flex justify-content-between align-items-center p-2 mb-2 rounded border shadow-sm item-temp";
        row.style.backgroundColor = "var(--bg-body)";
        row.innerHTML = `
            <input type="hidden" name="patologia_id[]" value="${sel.value}">
            <input type="hidden" name="patologia_detalle[]" value="${det.value}">
            <div style="font-size: 0.75rem;"><i class="fas fa-check-circle text-primary me-2"></i><b>${sel.options[sel.selectedIndex].text}</b> ${det.value ? ' - '+det.value : ''}</div>
            <button type="button" class="btn btn-sm text-danger" onclick="this.closest('.item-temp').remove()"><i class="fas fa-times-circle fa-lg"></i></button>`;
        listaP.appendChild(row);
        sel.value = ''; det.value = ''; sel.classList.remove('is-invalid');
    });

    // ENVÍO AJAX
    document.getElementById('formPaso6').addEventListener('submit', function(e) {
        e.preventDefault();

        if (document.getElementById('sw_discapacidad').checked && listaD.children.length === 0) {
            Swal.fire({ icon: 'warning', title: 'Atención', text: 'Debe agregar al menos una discapacidad.', background: swalBg, color: swalColor });
            return;
        }
        if (document.getElementById('sw_patologias').checked && listaP.children.length === 0) {
            Swal.fire({ icon: 'warning', title: 'Atención', text: 'Debe agregar al menos una patología.', background: swalBg, color: swalColor });
            return;
        }

        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Guardando...';

        fetch("{% url 'guardar_paso6' %}", {
            method: 'POST',
            body: new FormData(this),
            headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value }
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Salud Guardada', timer: 1500, showConfirmButton: false, background: swalBg, color: swalColor })
                .then(() => window.location.href = data.next_url);
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: data.error, background: swalBg, color: swalColor });
                btn.disabled = false; btn.innerHTML = 'GUARDAR Y CONTINUAR';
            }
        });
    });
});
</script>
{% endblock %}
