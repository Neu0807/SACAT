{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center mb-3">
        <div class="col-12 col-lg-11">
            <div class="card border-0 shadow-sm p-3" style="background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-body) 100%); border-radius: 15px;">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="icon-shape bg-primary-soft text-primary rounded-3 p-2 me-3">
                            <i class="fas fa-map-location-dot fa-lg"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0" style="color: var(--brand-primary);">Registro de Trabajador</h5>
                            <small class="text-muted">Paso 2: Domicilio y Vivienda</small>
                        </div>
                    </div>
                    <div class="text-end" style="min-width: 200px;">
                        <div class="d-flex align-items-center justify-content-end mb-1">
                            <span class="badge bg-primary-soft text-primary rounded-pill px-3 py-1 small fw-bold">25% Completado</span>
                        </div>
                        <div class="progress" style="height: 6px; background-color: rgba(0,0,0,0.05);">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 25%; background-color: var(--brand-primary);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-11">
            <div class="card border-0 shadow-sm" style="background-color: var(--bg-card); border-radius: 15px; overflow: hidden;">
                <form id="formUnificado" class="p-4" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-location-dot text-primary me-2"></i>
                            <h6 class="fw-bold mb-0">UBICACIÓN GEOGRÁFICA</h6>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">ESTADO <span class="text-danger">*</span></label>
                                <select name="estado" id="id_estado" class="form-select custom-input" required>
                                    <option value="" selected disabled>Seleccione...</option>
                                    {% for e in estados %}
                                    <option value="{{ e.id }}">{{ e.nombre_estado }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">MUNICIPIO <span class="text-danger">*</span></label>
                                <select name="municipio" id="id_municipio" class="form-select custom-input" required disabled>
                                    <option value="" selected disabled>Seleccione...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">PARROQUIA <span class="text-danger">*</span></label>
                                <select name="parroquia" id="id_parroquia" class="form-select custom-input" required disabled>
                                    <option value="" selected disabled>Seleccione...</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">DIRECCIÓN EXACTA <span class="text-danger">*</span></label>
                                <textarea name="direccion_exacta" class="form-control custom-input" rows="2" placeholder="Ej: Av. Principal, Bloque 1, Piso 5, Apto 502..." required></textarea>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-10">

                    <div class="mb-2">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-house-chimney text-primary me-2"></i>
                            <h6 class="fw-bold mb-0">CARACTERÍSTICAS DE LA VIVIENDA</h6>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">TIPO DE VIVIENDA <span class="text-danger">*</span></label>
                                <select name="tipo_vivienda" class="form-select custom-input" required>
                                    <option value="" selected disabled>Seleccione...</option>
                                    {% for tv in tipos_viviendas %}
                                    <option value="{{ tv.id }}">{{ tv.descripcion }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">CONDICIÓN DE VIVIENDA <span class="text-danger">*</span></label>
                                <select name="condicion_vivienda" class="form-select custom-input" required>
                                    <option value="" selected disabled>Seleccione...</option>
                                    {% for c in condiciones %}
                                    <option value="{{ c.id }}">{{ c.descripcion }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 pt-3 border-top d-flex justify-content-between">
                        <a href="{% url 'registro_paso1' %}" class="btn btn-light px-4 fw-bold text-muted border">
                            <i class="fas fa-chevron-left me-2"></i>VOLVER
                        </a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow" id="btnGuardar">
                            SIGUIENTE PASO <i class="fas fa-chevron-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-primary-soft { background-color: rgba(30, 58, 138, 0.1); }
    .custom-input { background-color: var(--bg-body) !important; border: 1px solid #e2e8f0 !important; border-radius: 10px !important; padding: 10px 15px !important; font-size: 0.95rem !important; }
    .custom-input:focus { border-color: var(--brand-primary) !important; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1) !important; background-color: #fff !important; }
    .btn-primary { background: linear-gradient(135deg, var(--brand-primary) 0%, #3b82f6 100%) !important; border: none !important; border-radius: 10px !important; padding: 12px 30px !important; }
</style>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const selectEstado = document.getElementById('id_estado');
    const selectMunicipio = document.getElementById('id_municipio');
    const selectParroquia = document.getElementById('id_parroquia');
    const form = document.getElementById('formUnificado');

    // 1. CARGAR MUNICIPIOS
    selectEstado.addEventListener('change', function() {
        fetch(`/trabajadores/get-municipios/${this.value}/`)
            .then(r => r.json())
            .then(data => {
                selectMunicipio.innerHTML = '<option value="" selected disabled>Seleccione...</option>';
                data.forEach(m => selectMunicipio.innerHTML += `<option value="${m.id}">${m.nombre_municipio}</option>`);
                selectMunicipio.disabled = false;
                selectParroquia.innerHTML = '<option value="" selected disabled>Seleccione...</option>';
                selectParroquia.disabled = true;
            });
    });

    // 2. CARGAR PARROQUIAS
    selectMunicipio.addEventListener('change', function() {
        fetch(`/trabajadores/get-parroquias/${this.value}/`)
            .then(r => r.json())
            .then(data => {
                selectParroquia.innerHTML = '<option value="" selected disabled>Seleccione...</option>';
                data.forEach(p => selectParroquia.innerHTML += `<option value="${p.id}">${p.nombre_parroquia}</option>`);
                selectParroquia.disabled = false;
            });
    });

    // 3. ENVÍO UNIFICADO
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
        
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Guardando...';

        fetch("{% url 'guardar_paso2' %}", {
            method: "POST",
            body: new FormData(this),
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Domicilio Guardado', timer: 1500, showConfirmButton: false })
                .then(() => window.location.href = data.next_url);
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: data.error });
                btn.disabled = false;
                btn.innerHTML = 'SIGUIENTE PASO';
            }
        });
    });
});
</script>
{% endblock %}
