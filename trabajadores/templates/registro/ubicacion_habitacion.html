{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-lg-11">
            <div class="card border-0 shadow-sm p-4" style="background-color: var(--bg-card); border-radius: 15px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h4 class="fw-bold mb-0" style="color: var(--brand-primary);">
                            <i class="fas fa-map-location-dot me-2"></i>Registro de Trabajador
                        </h4>
                        <p class="text-muted small mb-0">Paso 2: Ubicación de Habitación</p>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-primary rounded-pill px-3">20% Completado</span>
                    </div>
                </div>
                <div class="progress" style="height: 8px; background-color: var(--bg-body);">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 20%; background-color: var(--brand-primary);"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-11">
            <div class="card border-0 shadow-sm" style="background-color: var(--bg-card); border-radius: 15px; overflow: hidden;">
                <div class="card-header bg-transparent border-0 p-4 pb-0">
                    <div class="d-flex align-items-center">
                        <div class="icon-shape text-white rounded-3 p-3 me-3" style="background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-dark) 100%); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-house-user fa-lg"></i>
                        </div>
                        <h5 class="fw-bold mb-0" style="color: var(--text-main);">Domicilio Actual</h5>
                    </div>
                </div>

                <form id="formUbicacion" class="p-4" novalidate>
                    {% csrf_token %}
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Estado <span class="text-danger">*</span></label>
                            <select name="estado" id="id_estado" class="form-select custom-input" required>
                                <option value="" selected disabled>Seleccione Estado...</option>
                                {% for e in estados %}
                                <option value="{{ e.id }}">{{ e.nombre_estado }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Municipio <span class="text-danger">*</span></label>
                            <select name="municipio" id="id_municipio" class="form-select custom-input" required disabled>
                                <option value="" selected disabled>Seleccione Municipio...</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Parroquia <span class="text-danger">*</span></label>
                            <select name="parroquia" id="id_parroquia" class="form-select custom-input" required disabled>
                                <option value="" selected disabled>Seleccione Parroquia...</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Dirección Exacta (Calle, Casa/Apto, Punto de Ref.) <span class="text-danger">*</span></label>
                            <textarea name="direccion_exacta" class="form-control custom-input" rows="3" placeholder="Ej: Urbanización El Silencio, Bloque 1, Piso 2, Apto 24..." required></textarea>
                        </div>
                    </div>

                    <div class="mt-5 pt-3 border-top d-flex justify-content-between">
                        <a href="{% url 'registro_paso1' %}" class="btn btn-light px-4 fw-bold text-muted">
                            <i class="fas fa-chevron-left me-2"></i>Volver al Paso 1
                        </a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm" id="btnSiguiente">
                            SIGUIENTE PASO <i class="fas fa-chevron-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .custom-input { background-color: var(--bg-body) !important; border: 1px solid var(--border-color) !important; border-radius: 10px !important; padding: 12px 15px !important; color: var(--text-main) !important; }
    .custom-input:focus { border-color: var(--brand-primary) !important; box-shadow: 0 0 0 0.25rem rgba(30, 58, 138, 0.1) !important; background-color: #fff !important; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const selectEstado = document.getElementById('id_estado');
    const selectMunicipio = document.getElementById('id_municipio');
    const selectParroquia = document.getElementById('id_parroquia');

    // 1. CARGAR MUNICIPIOS AL CAMBIAR ESTADO
    selectEstado.addEventListener('change', function() {
        const estadoId = this.value;
        
        // Limpiamos y bloqueamos los hijos
        selectMunicipio.innerHTML = '<option value="">Cargando...</option>';
        selectMunicipio.disabled = true;
        selectParroquia.innerHTML = '<option value="">Seleccione Municipio...</option>';
        selectParroquia.disabled = true;

        fetch(`/trabajadores/get-municipios/${estadoId}/`)
            .then(response => response.json())
            .then(data => {
                selectMunicipio.innerHTML = '<option value="" selected disabled>Seleccione Municipio...</option>';
                data.forEach(m => {
                    selectMunicipio.innerHTML += `<option value="${m.id}">${m.nombre_municipio}</option>`;
                });
                selectMunicipio.disabled = false;
            });
    });

    // 2. CARGAR PARROQUIAS AL CAMBIAR MUNICIPIO
    selectMunicipio.addEventListener('change', function() {
        const municipioId = this.value;
        selectParroquia.innerHTML = '<option value="">Cargando...</option>';
        selectParroquia.disabled = true;

        fetch(`/trabajadores/get-parroquias/${municipioId}/`)
            .then(response => response.json())
            .then(data => {
                selectParroquia.innerHTML = '<option value="" selected disabled>Seleccione Parroquia...</option>';
                data.forEach(p => {
                    selectParroquia.innerHTML += `<option value="${p.id}">${p.nombre_parroquia}</option>`;
                });
                selectParroquia.disabled = false;
            });
    });
});
</script>
{% endblock %}
