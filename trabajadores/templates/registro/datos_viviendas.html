{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center mb-3">
        <div class="col-12 col-lg-11">
            <div class="card border-0 shadow-sm p-3" style="background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-body) 100%); border-radius: 15px;">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="icon-shape bg-primary-soft text-primary rounded-3 p-2 me-3">
                            <i class="fas fa-home-lg-alt fa-lg"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0" style="color: var(--brand-primary);">Registro de Trabajador</h5>
                            <small class="text-muted">Paso 3: Características de la Vivienda</small>
                        </div>
                    </div>
                    <div class="text-end" style="min-width: 200px;">
                        <div class="d-flex align-items-center justify-content-end mb-1">
                            <span class="badge bg-primary-soft text-primary rounded-pill px-3 py-1 small fw-bold">30% Completado</span>
                        </div>
                        <div class="progress" style="height: 6px; background-color: rgba(0,0,0,0.05);">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 30%; background-color: var(--brand-primary);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-11">
            <div class="card border-0 shadow-sm" style="background-color: var(--bg-card); border-radius: 15px; overflow: hidden;">
                <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-house-chimney text-primary me-2"></i>
                        <h6 class="fw-bold mb-0" style="color: var(--text-main);">DETALLES DEL HOGAR</h6>
                    </div>
                    <hr class="mt-2 mb-0 opacity-10">
                </div>

                <form id="formVivienda" class="p-4 pt-3" novalidate>
                    {% csrf_token %}
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">TIPO DE VIVIENDA <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-building text-muted"></i></span>
                                <select name="tipo_vivienda" class="form-select custom-input border-start-0" required>
                                    <option value="" selected disabled>Seleccione tipo...</option>
                                    {% for tv in tipos_viviendas %}
                                    <option value="{{ tv.id }}">{{ tv.descripcion }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-text small">Ej: Casa, Apartamento, Quinta.</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">CONDICIÓN DE VIVIENDA <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-file-contract text-muted"></i></span>
                                <select name="condicion_vivienda" class="form-select custom-input border-start-0" required>
                                    <option value="" selected disabled>Seleccione condición...</option>
                                    {% for c in condiciones %}
                                    <option value="{{ c.id }}">{{ c.descripcion }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-text small">Ej: Propia, Alquilada, Adjudicada.</div>
                        </div>
                    </div>

                    <div class="mt-5 pt-3 border-top d-flex justify-content-between">
                        <a href="{% url 'registro_paso2' %}" class="btn btn-light px-4 fw-bold text-muted border">
                            <i class="fas fa-chevron-left me-2"></i>Volver al Paso 2
                        </a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow" id="btnGuardar">
                            SIGUIENTE PASO <i class="fas fa-chevron-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-primary-soft { background-color: rgba(30, 58, 138, 0.1); }
    .custom-input { 
        background-color: var(--bg-body) !important; 
        border: 1px solid #e2e8f0 !important; 
        border-radius: 10px !important; 
        padding: 12px 15px !important; 
        font-size: 0.95rem !important;
    }
    .custom-input:focus { 
        border-color: var(--brand-primary) !important; 
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1) !important; 
        background-color: #fff !important; 
    }
    .btn-primary { 
        background: linear-gradient(135deg, var(--brand-primary) 0%, #3b82f6 100%) !important; 
        border: none !important; 
        border-radius: 10px !important; 
        padding: 12px 30px !important; 
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2) !important; }
</style>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('formVivienda');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Validación básica
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }
        
        const btn = document.getElementById('btnGuardar');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Guardando...';

        fetch("{% url 'guardar_paso3' %}", {
            method: "POST",
            body: new FormData(this),
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                Swal.fire({ 
                    icon: 'success', 
                    title: 'Paso 3 Completado', 
                    text: 'Información de vivienda guardada correctamente.',
                    timer: 1500, 
                    showConfirmButton: false 
                }).then(() => window.location.href = data.next_url);
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: data.error });
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        })
        .catch(error => {
            Swal.fire({ icon: 'error', title: 'Error de Red', text: 'No se pudo conectar con el servidor.' });
            btn.disabled = false;
            btn.innerHTML = originalText;
        });
    });
});
</script>
{% endblock %}
